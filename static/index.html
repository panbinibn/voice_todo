<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 记忆外挂</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --primary-dark: #e55a5a;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --text: #2D3436;
            --text-secondary: #636E72;
            --text-light: #B2BEC3;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
            --radius-sm: 12px;
            --radius: 16px;
            --radius-lg: 20px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .main-content {
            padding: 20px 16px 100px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        /* 悬浮按钮 */
        .fab-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF6B6B, #ee5a24);
            color: white;
            border: none;
            font-size: 32px;
            box-shadow: 0 4px 16px rgba(255,107,107,0.4);
            cursor: pointer;
            z-index: 800;
            transition: transform 0.3s ease;
        }
        .fab-btn:active {
            transform: scale(0.9);
        }

        /* 分类卡片 */
        .category-card {
            background: white;
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .category-header {
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: #fafafa;
        }
        .category-header .arrow {
            transition: transform 0.3s ease;
            font-size: 12px;
        }
        .category-header .arrow.open {
            transform: rotate(180deg);
        }
        .category-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .category-body.expanded {
            max-height: 600px;
        }
        .category-body .todo-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
        }
        .category-body .todo-item:last-child {
            border-bottom: none;
        }
        .category-body .todo-item img {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            margin-right: 12px;
            object-fit: cover;
        }
        .category-body .todo-item .info {
            flex: 1;
        }
        .category-body .todo-item .title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
        }
        .category-body .todo-item .meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* 输入模态框 */
        .input-modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1500;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }
        .input-modal-overlay.show {
            display: flex;
        }
        .input-modal-content {
            background: white;
            width: 100%;
            max-height: 85%;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px;
            overflow-y: auto;
            animation: slideUp 0.35s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .input-modal-content .tab-bar {
            display: flex;
            margin-bottom: 20px;
            border-radius: var(--radius);
            background: #f0f0f0;
            padding: 4px;
        }
        .input-modal-content .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        .input-modal-content .tab.active {
            background: white;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
        .input-modal-content .tab-content {
            display: none;
        }
        .input-modal-content .tab-content.active {
            display: block;
        }

        .generate-btn {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        .record-btn {
            width: 100%;
        }
        .record-btn.recording {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #e55a5a, #d63031);
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(0.95); }
        }

        /* 录音全屏动画 */
        .record-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .record-modal.active {
            display: flex;
        }
        .record-modal .hint-text {
            color: white;
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        .record-modal .wave-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 80px;
            margin-bottom: 40px;
        }
        .record-modal .wave-bar {
            width: 6px;
            height: 20px;
            background: var(--primary);
            border-radius: 3px;
            animation: wave 1.2s ease-in-out infinite;
        }
        .record-modal .wave-bar:nth-child(1) { animation-delay: 0s; }
        .record-modal .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .record-modal .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .record-modal .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .record-modal .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .record-modal .wave-bar:nth-child(6) { animation-delay: 0.5s; }
        .record-modal .wave-bar:nth-child(7) { animation-delay: 0.6s; }
        .record-modal .wave-bar:nth-child(8) { animation-delay: 0.7s; }
        .record-modal .wave-bar:nth-child(9) { animation-delay: 0.8s; }
        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 70px; }
        }
        .record-modal .release-hint {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-top: 20px;
        }

        .image-preview-area img {
            max-width: 120px;
            border-radius: var(--radius-sm);
            margin-top: 8px;
        }
        .clear-img-btn {
            color: var(--primary);
            background: none;
            border: none;
            font-size: 14px;
            display: block;
            margin: 4px auto 0;
        }
    </style>
</head>
<body>
    <!-- 主界面 -->
    <div class="main-content">
        <div class="header">
            <h1>🧠 记忆外挂</h1>
        </div>

        <!-- 分类待办列表 -->
        <div class="category-list" id="categoryList">
            <p style="text-align:center;color:var(--text-light);">加载中...</p>
        </div>
    </div>

    <!-- 悬浮按钮 -->
    <button class="fab-btn" onclick="openInputModal()">+</button>

    <!-- 输入模态框 -->
    <div class="input-modal-overlay" id="inputModalOverlay" onclick="closeInputModal()">
        <div class="input-modal-content" onclick="event.stopPropagation()">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h3 style="font-size:18px;">新建待办</h3>
                <button onclick="closeInputModal()" style="background:none;border:none;font-size:24px;cursor:pointer;">✕</button>
            </div>

            <div class="tab-bar">
                <div class="tab active" id="tabVoice" onclick="switchInputTab('voice')">🎤 语音</div>
                <div class="tab" id="tabText" onclick="switchInputTab('text')">⌨️ 打字</div>
            </div>

            <!-- 语音面板 -->
            <div class="tab-content active" id="voicePanel">
                <p id="voiceStatus" style="text-align:center;color:var(--text-secondary);">按住下方按钮开始录音</p>
                <button class="generate-btn record-btn" id="voiceRecordBtn">按住录音</button>
                <div id="voicePlayer" style="display:none;margin-top:12px;"></div>
            </div>

            <!-- 文字面板 -->
            <div class="tab-content" id="textPanel">
                <textarea id="manualText" placeholder="输入你想记的事..." style="width:100%;border:1px solid #ddd;border-radius:var(--radius-sm);padding:12px;font-size:16px;resize:none;min-height:100px;outline:none;"></textarea>
                <button class="generate-btn" onclick="submitTextTodo()" style="margin-top:12px;">✨ 生成待办</button>
            </div>

            <!-- 图片附件 -->
            <div style="margin-top:16px;text-align:center;">
                <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none;" />
                <button class="generate-btn" style="background:#eee;color:var(--text);" onclick="document.getElementById('imageInput').click()">📎 附加图片</button>
                <div class="image-preview-area" id="imagePreviewArea" style="display:none;">
                    <img id="previewImg" src="" alt="预览" />
                    <button class="clear-img-btn" onclick="clearImage()">移除图片</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 录音全屏动画 -->
    <div class="record-modal" id="recordModal">
        <div class="hint-text">🎤 正在聆听...</div>
        <div class="wave-box">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
        <div class="release-hint">松手结束录音</div>
    </div>

    <script>
        // ========== 全局状态 ==========
        let audioChunks = [];
        let mediaRecorder;
        let audioStream = null;
        let recordedBlob = null;
        let selectedImageFile = null;
        const userId = localStorage.getItem('todo_user_id') || (() => {
            const id = 'user_' + crypto.randomUUID();
            localStorage.setItem('todo_user_id', id);
            return id;
        })();

        // ========== 加载分类待办 ==========
        async function loadCategoryTodos() {
            const container = document.getElementById('categoryList');
            container.innerHTML = '<p style="text-align:center;color:var(--text-light);">加载中...</p>';
            try {
                const resp = await fetch(`/api/todos?user_id=${userId}`);
                const data = await resp.json();
                if (!data.todos || data.todos.length === 0) {
                    container.innerHTML = '<p style="text-align:center;color:var(--text-light);">暂无待办，点击右下角 + 添加</p>';
                    return;
                }
                const groups = {};
                data.todos.forEach(t => {
                    const cat = t.category || '未分类';
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(t);
                });
                let html = '';
                Object.keys(groups).forEach((cat, idx) => {
                    html += `<div class="category-card">
                        <div class="category-header" onclick="toggleCategory(this)">
                            <span>📁 ${cat} (${groups[cat].length})</span>
                            <span class="arrow${idx === 0 ? ' open' : ''}">▼</span>
                        </div>
                        <div class="category-body${idx === 0 ? ' expanded' : ''}">
                            ${groups[cat].map(t => {
                                const icon = {"高":"🔴","中":"🟡","低":"🟢"}[t.priority] || "⚪";
                                return `<div class="todo-item">
                                    ${t.image_url ? `<img src="${t.image_url}">` : ''}
                                    <div class="info">
                                        <div class="title">${t.title}</div>
                                        <div class="meta">⏰ ${t.deadline || '未指定'} | ${icon} ${t.priority || '中'}</div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<p style="color:red;text-align:center;">加载失败</p>';
            }
        }

        function toggleCategory(header) {
            const arrow = header.querySelector('.arrow');
            const body = header.nextElementSibling;
            arrow.classList.toggle('open');
            body.classList.toggle('expanded');
        }

        // ========== 输入模态框 ==========
        function openInputModal() {
            document.getElementById('inputModalOverlay').classList.add('show');
            switchInputTab('voice');
        }
        function closeInputModal() {
            document.getElementById('inputModalOverlay').classList.remove('show');
        }
        function switchInputTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (type === 'voice') {
                document.getElementById('tabVoice').classList.add('active');
                document.getElementById('voicePanel').classList.add('active');
            } else {
                document.getElementById('tabText').classList.add('active');
                document.getElementById('textPanel').classList.add('active');
            }
        }

        // ========== 录音 (iPhone 兼容) ==========
        const voiceRecordBtn = document.getElementById('voiceRecordBtn');
        voiceRecordBtn.addEventListener('touchstart', async (e) => {
            e.preventDefault();
            if (!audioStream) {
                try {
                    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    document.getElementById('voiceStatus').textContent = '✅ 麦克风已就绪，请再次按住录音';
                } catch (err) {
                    alert("无法访问麦克风：" + err.message);
                }
                return;
            }
            document.getElementById('recordModal').classList.add('active');
            const mimeTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', ''];
            let started = false;
            for (const mime of mimeTypes) {
                if (started) break;
                try {
                    const options = mime ? { mimeType: mime } : {};
                    mediaRecorder = new MediaRecorder(audioStream, options);
                    mediaRecorder.ondataavailable = ev => audioChunks.push(ev.data);
                    mediaRecorder.onstop = () => {
                        document.getElementById('recordModal').classList.remove('active');
                        if (audioChunks.length > 0) {
                            recordedBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                            showVoicePlayer(recordedBlob);
                        }
                    };
                    audioChunks = [];
                    mediaRecorder.start();
                    started = true;
                } catch (err) {
                    console.warn('尝试格式失败:', mime, err);
                }
            }
            if (!started) {
                document.getElementById('recordModal').classList.remove('active');
                alert('当前浏览器不支持录音');
            }
        });
        voiceRecordBtn.addEventListener('touchend', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        });

        function showVoicePlayer(blob) {
            const container = document.getElementById('voicePlayer');
            container.innerHTML = `<audio controls src="${URL.createObjectURL(blob)}" style="width:100%;"></audio>
                <button class="generate-btn" onclick="submitVoiceTodo()">✨ 生成待办</button>`;
            container.style.display = 'block';
        }

        // ========== 提交待办 ==========
        async function submitVoiceTodo() {
            if (!recordedBlob) return;
            const formData = new FormData();
            formData.append('audio', recordedBlob, 'recording.webm');
            formData.append('user_id', userId);
            if (selectedImageFile) formData.append('image', selectedImageFile);
            await submitAndRefresh(formData);
        }

        async function submitTextTodo() {
            const text = document.getElementById('manualText').value.trim();
            if (!text) return;
            const formData = new FormData();
            formData.append('text', text);
            formData.append('user_id', userId);
            if (selectedImageFile) formData.append('image', selectedImageFile);
            await submitAndRefresh(formData);
        }

        async function submitAndRefresh(formData) {
            try {
                const resp = await fetch('/api/todo', { method: 'POST', body: formData });
                const data = await resp.json();
                if (data.todos && data.todos.length > 0) await loadCategoryTodos();
                recordedBlob = null;
                audioChunks = [];
                document.getElementById('voicePlayer').innerHTML = '';
                document.getElementById('voicePlayer').style.display = 'none';
                document.getElementById('manualText').value = '';
                document.getElementById('voiceStatus').textContent = '按住下方按钮开始录音';
                clearImage();
                closeInputModal();
            } catch (e) {
                alert('提交失败');
            }
        }

        // ========== 图片处理 ==========
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedImageFile = file;
                const reader = new FileReader();
                reader.onload = ev => {
                    document.getElementById('previewImg').src = ev.target.result;
                    document.getElementById('imagePreviewArea').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
        function clearImage() {
            selectedImageFile = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewArea').style.display = 'none';
        }

        // ========== 初始化 ==========
        window.addEventListener('load', loadCategoryTodos);
    </script>
</body>
</html>
